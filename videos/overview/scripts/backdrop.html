<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backdrop</title>
<!-- A neutral desktop for capture-desktop.mjs: soft wallpaper and two blurred,
     unreadable windows, so the recording shows a desktop and nothing personal. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; cursor: none; }
  body {
    background:
      radial-gradient(1200px 800px at 18% 20%, rgba(79, 166, 255, 0.35), transparent 60%),
      radial-gradient(1000px 700px at 85% 85%, rgba(255, 150, 100, 0.22), transparent 60%),
      radial-gradient(900px 600px at 70% 15%, rgba(143, 134, 255, 0.25), transparent 60%),
      linear-gradient(160deg, #0b1a3a 0%, #0a1430 45%, #120f24 100%);
  }
  .win { position: absolute; border-radius: 14px; background: rgba(18, 24, 40, 0.86); border: 1px solid rgba(255, 255, 255, 0.10); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); filter: blur(6px); overflow: hidden; }
  .bar { height: 30px; background: rgba(255, 255, 255, 0.05); }
  .line { height: 10px; margin: 14px 22px; border-radius: 6px; background: rgba(160, 190, 255, 0.22); }
  .line.a { width: 55%; } .line.b { width: 72%; background: rgba(143, 243, 255, 0.22); } .line.c { width: 38%; } .line.d { width: 64%; background: rgba(255, 181, 71, 0.18); }
</style>
</head>
<body>
  <div class="win" style="left:4%;top:9%;width:46%;height:62%"><div class="bar"></div>
    <div class="line a"></div><div class="line b"></div><div class="line c"></div><div class="line d"></div><div class="line a"></div><div class="line b"></div><div class="line c"></div><div class="line a"></div><div class="line d"></div><div class="line b"></div>
  </div>
  <div class="win" style="left:20%;top:58%;width:38%;height:30%"><div class="bar"></div>
    <div class="line c"></div><div class="line b"></div><div class="line a"></div><div class="line c"></div>
  </div>
</body>
</html>
