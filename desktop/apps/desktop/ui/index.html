<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Companion</title>
<style>
  /* Only the character may be opaque, or this stops being a companion on the
     desktop and becomes a box sitting on top of everything. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font: 12px ui-sans-serif, system-ui, "Segoe UI", sans-serif;
    /* The shell decides what is clickable, so nothing here should show a
       caret or let the window be dragged by a text selection. */
    user-select: none;
    cursor: default;
  }
  body { display: grid; place-items: center; }
  /* Two layers: the case, drawn once, and the engine's frame at its own size,
     which the compositor places over the screen. */
  #device { position: relative; }
  #device.hidden { display: none; }
  #device.over-button { cursor: pointer; }
  #device canvas { position: absolute; left: 0; top: 0; display: block; }
  #device canvas[hidden] { display: none; }
  #message {
    display: none;
    padding: 12px;
    text-align: center;
    color: #cfe;
    text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
    line-height: 1.5;
  }
  #message.visible { display: block; }
</style>
</head>
<body>
  <div id="device" class="hidden">
    <canvas id="case"></canvas>
    <canvas id="stage"></canvas>
    <canvas id="install" hidden></canvas>
  </div>
  <p id="message" role="status">Starting…</p>
  <script src="webview.js"></script>
</body>
</html>
