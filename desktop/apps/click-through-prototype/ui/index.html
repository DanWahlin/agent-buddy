<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Click-through prototype</title>
<style>
  /* Nothing may be opaque but the character, or the window stops being a pet
     and starts being a box sitting on top of everything. */
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font: 12px ui-sans-serif, system-ui, sans-serif;
  }
  canvas { display: block; width: 100%; height: 100%; }
  #readout {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    text-align: center;
    color: #cfe;
    text-shadow: 0 1px 2px #000;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <p id="readout">starting…</p>

<script>
const canvas = document.getElementById('stage');
const context = canvas.getContext('2d');
const readout = document.getElementById('readout');
const invoke = window.__TAURI__.core.invoke;

/** The character, as an ellipse. Same shape the Rust side hit-tests against. */
let head = { cx: 0, cy: 0, rx: 0, ry: 0 };
let poked = 0;

function layout() {
  const ratio = window.devicePixelRatio || 1;
  const width = document.documentElement.clientWidth;
  const height = document.documentElement.clientHeight;

  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  context.setTransform(ratio, 0, 0, ratio, 0, 0);

  head = { cx: width / 2, cy: height / 2 - 10, rx: width * 0.34, ry: height * 0.30 };

  // Rust cannot see what was drawn, so it has to be told. In the real app this
  // would come from the pack's frame size rather than the window's.
  invoke('set_region', { region: head });
}

function draw(now) {
  requestAnimationFrame(draw);
  const width = canvas.width / (window.devicePixelRatio || 1);
  const height = canvas.height / (window.devicePixelRatio || 1);
  context.clearRect(0, 0, width, height);

  const startled = now - poked < 700;

  // The head: the only opaque thing on the window.
  context.beginPath();
  context.ellipse(head.cx, head.cy, head.rx, head.ry, 0, 0, Math.PI * 2);
  context.fillStyle = startled ? '#2b6f78' : '#1d4f57';
  context.fill();
  context.lineWidth = 3;
  context.strokeStyle = '#50d7ef';
  context.stroke();

  // Eyes, so it is obvious which way is up and whether it reacted.
  const eyeY = head.cy - head.ry * 0.15;
  for (const side of [-1, 1]) {
    context.beginPath();
    context.ellipse(head.cx + side * head.rx * 0.34, eyeY,
      head.rx * 0.13, head.ry * (startled ? 0.22 : 0.16), 0, 0, Math.PI * 2);
    context.fillStyle = '#eafcff';
    context.fill();
  }
}

/**
 * These only arrive while Rust has handed the window the mouse, which is the
 * whole point: if the hit test is wrong, nothing here ever fires.
 */
canvas.addEventListener('pointermove', event => {
  readout.textContent = 'pointer over the character at '
    + Math.round(event.clientX) + ',' + Math.round(event.clientY);
});
canvas.addEventListener('pointerdown', () => {
  poked = performance.now();
  readout.textContent = 'poked';
});
canvas.addEventListener('pointerleave', () => {
  readout.textContent = 'pointer gone';
});

window.addEventListener('resize', layout);
layout();
requestAnimationFrame(draw);

// Say out loud whether the window currently owns the mouse, so the two halves
// can be compared without guessing.
setInterval(async () => {
  const over = await invoke('is_over');
  if (!over) readout.textContent = 'clicks are passing through';
}, 250);
</script>
</body>
</html>
