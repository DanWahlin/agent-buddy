    real holes rather than painted-over shapes. VS Code may render an activity
    bar icon as a mask, where only alpha counts and a "knocked out" fill colour
    would simply vanish.

    Drawn as a silhouette rather than strokes: at 24px, detail finer than about
    1.5px disappears.
  -->
