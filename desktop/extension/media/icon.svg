<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Copilot's face, the character the extension opens on. Its signature at this
    size is the pair of goggles and the bridge between them, so those and the
    faceplate seam are all the detail that survives.

    One path, fill-rule evenodd, so the goggles and the seam are real holes
    rather than painted-over shapes. VS Code may render an activity bar icon as
    a mask, where only alpha counts and a "knocked out" fill colour would simply
    vanish.

    Drawn as a silhouette rather than strokes: at 24px, detail finer than about
    1.5px disappears, which is why the faceplate is one seam rather than its
    outline and two lights.
  -->
  <path fill="currentColor" fill-rule="evenodd" d="
    M9.6 4.2h4.8a4.6 4.6 0 0 1 4.6 4.6v5.6a4.6 4.6 0 0 1-4.6 4.6H9.6
      a4.6 4.6 0 0 1-4.6-4.6V8.8a4.6 4.6 0 0 1 4.6-4.6z
    M5 10.8h-.4a1.6 1.6 0 0 0-1.6 1.6v1.6a1.6 1.6 0 0 0 1.6 1.6H5z
    M19 10.8h.4a1.6 1.6 0 0 1 1.6 1.6v1.6a1.6 1.6 0 0 1-1.6 1.6H19z
    M8.2 6.4h1.4a1.6 1.6 0 0 1 1.6 1.6v2a1.6 1.6 0 0 1-1.6 1.6H8.2
      a1.6 1.6 0 0 1-1.6-1.6V8a1.6 1.6 0 0 1 1.6-1.6z
    M14.4 6.4h1.4a1.6 1.6 0 0 1 1.6 1.6v2a1.6 1.6 0 0 1-1.6 1.6h-1.4
      a1.6 1.6 0 0 1-1.6-1.6V8a1.6 1.6 0 0 1 1.6-1.6z
    M6.8 13.6h10.4v1.4H6.8z
  "/>
</svg>
