name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'desktop/engine/prebuilt/**'
      - '.github/workflows/pages.yml'
  # Build and Release starts this after it publishes a release, so that the live demo gets the new
  # character packs. A release that a workflow publishes starts no `release` event workflow.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Download the character previews
        # The Characters page's free preview packs are files on the character-previews
        # pre-release (see website/README.md). A pre-release never becomes the
        # latest release, so the app downloads don't change.
        run: |
          gh release download character-previews --repo "$GITHUB_REPOSITORY" \
            --pattern character-previews.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/character-previews.zip" -d "$RUNNER_TEMP/previews"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build the website
        # Copies the engine from desktop/engine/prebuilt, downloads the
        # character packs from the latest release for the live demo, and adds
        # the Characters page's previews.
        run: node website/scripts/build.mjs --out _site --download --packs "$RUNNER_TEMP/previews"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Set up Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload the website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
