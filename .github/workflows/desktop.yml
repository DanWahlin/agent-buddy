name: Desktop Agent Companion

on:
  push:
    branches: [main, desktop-companion]
    paths:
      - 'desktop/**'
      # The desktop runs the firmware's engine and the device's packs, so a
      # change to either must still match frame for frame.
      - 'firmware/AgentCompanion/src/**'
      - 'characters/**'
      - 'tools/character_pack.py'
      - 'tools/character_preview.cpp'
      - 'tools/HostSpriteInflate.h'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'firmware/AgentCompanion/src/**'
      - 'characters/**'
      - 'tools/character_pack.py'
      - 'tools/character_preview.cpp'
      - 'tools/HostSpriteInflate.h'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  engine:
    # Compiles the firmware's engine to WebAssembly and checks it draws every
    # frame exactly as the native firmware build does, for every character.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Build the character packs
        working-directory: .
        run: |
          python -m pip install -r requirements-art.txt
          python tools/character_pack.py build

      - uses: mymindstorm/setup-emsdk@v14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck and parity test
        run: npm test

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-engine
          path: desktop/engine/dist/engine.js
          if-no-files-found: error

  shell:
    # The Rust shell: the daemon client, pack choice, placement and click-through.
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: desktop-engine
          path: desktop/engine/dist

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - name: Build the page and icons
        shell: bash
        run: |
          echo '{ "type": "commonjs" }' > engine/dist/package.json
          npm run build -w @agent-companion/desktop

      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        working-directory: desktop/apps/desktop/src-tauri
        run: cargo test
