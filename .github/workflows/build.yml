name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      sign_windows:
        description: Sign the Windows apps (runs in the release environment, which allows only v* tags by default)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # arduino/setup-arduino-cli's latest release (v2.0.0) still declares node20; run it on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ARDUINO_CORE: esp32:esp32@3.3.10

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/release.py --check-tag "$GITHUB_REF_NAME"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-art.txt
            requirements-flash.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Restore lossless compression cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/sprite-compression
          key: sprites-${{ runner.os }}-${{ hashFiles('requirements-art.txt', 'tools/sprite_*.py', 'characters/copilot/tools/export_sprite_firmware.py', 'characters/copilot/sprites/animation.json', 'characters/copilot/expressions/animation.json', 'characters/claude/tools/export_frames.py', 'characters/claude/sprites/animation.json', 'characters/grok/tools/export_frames.py', 'characters/grok/sprites/animation.json') }}
          restore-keys: sprites-${{ runner.os }}-
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-art.txt -r requirements-flash.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Reproduce and verify generated assets
        run: |
          python characters/copilot/tools/export_sprite_firmware.py
          python characters/claude/tools/export_frames.py
          python characters/grok/tools/export_frames.py
          python tools/embed_audio.py
          git diff --exit-code -- characters/copilot/frames.bin characters/copilot/frames.json
          git diff --exit-code -- characters/claude/frames.bin characters/claude/frames.json
          git diff --exit-code -- characters/grok/frames.bin characters/grok/frames.json
          git diff --exit-code -- firmware/AgentCompanion/generated/audio_assets.h firmware/AgentCompanion/src/audio_data.cpp
      - name: Test native renderer and release tools
        run: |
          bash tools/test.sh
          bash tools/test_sprite_renderer.sh
          bash tools/test_character_packs.sh
          bash tools/test_character.sh
          bash tools/test_working_bits.sh
          bash tools/test_device_inputs.sh
          bash tools/run_sprite_motion_tests.sh
          bash tools/build_character_preview.sh
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Test companion daemon
        working-directory: daemon
        run: |
          npm ci
          npm test
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - name: Install pinned ESP32 core and vendor libraries
        run: |
          mkdir -p "$RUNNER_TEMP/arduino" .deps
          arduino-cli config init --dest-dir "$RUNNER_TEMP/arduino"
          config="$RUNNER_TEMP/arduino/arduino-cli.yaml"
          arduino-cli --config-file "$config" config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli --config-file "$config" core update-index
          arduino-cli --config-file "$config" core install "$ARDUINO_CORE"
          # Each board in firmware/boards.json pins its vendor libraries to one revision. The boards
          # share the same Waveshare library revision, so one checkout serves them all.
          python3 tools/boards.py fetch-vendor .deps/waveshare
      - name: Build matched firmware
        run: |
          export ARDUINO_CLI="$(command -v arduino-cli)"
          export ARDUINO_CONFIG="$RUNNER_TEMP/arduino/arduino-cli.yaml"
          export WAVESHARE_DIR="$GITHUB_WORKSPACE/.deps/waveshare"
          # Every board must build. Releases carry a firmware ZIP for each board.
          for board in $(python3 tools/boards.py list); do
            BOARD="$board" bash tools/arduino.sh build
          done
      - name: Package firmware and character packs
        run: |
          python tools/package_release.py --version "$(cat VERSION)" --all-boards \
            --repository "$GITHUB_REPOSITORY"
      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: |
            build/release/*-firmware.zip
            build/release/*-characters.zip
            build/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  daemon-windows:
    # The companion service on native Windows: named pipes, the Run key, PowerShell
    # hooks, %LOCALAPPDATA% paths and WSL path mapping. The Rust launcher's tests run
    # on Windows in desktop.yml. Both runners also build the fixed serialport binding
    # that the release bundles (desktop/apps/desktop/scripts/serialport-windows.mjs).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    # A run takes 2 to 5 minutes, so a hang fails here, not after the 6-hour default.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: daemon
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - run: npm ci
      - name: Test companion daemon
        # The build and tests take less than a minute.
        timeout-minutes: 5
        run: npm test
      - name: Build and load the fixed serialport binding
        working-directory: .
        env:
          AGENT_COMPANION_BUILD_SERIALPORT: '1'
        run: node --test desktop/engine/test/serialport-windows.test.mjs

  desktop:
    # The desktop app, ready to run: no Rust or Emscripten needed to use it.
    # Built on tags (and by hand), as the release is the only place it ships.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # The app carries the daemon, with the release's own character packs.
    needs: build
    # Release builds sign the Windows apps with Azure Artifact Signing, so Smart App Control lets
    # them run. Signing needs the release environment's Azure login, which only v* tags can use.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign_windows) && 'release' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      SIGN_WINDOWS: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.sign_windows) && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
          # The oldest supported Ubuntu, so the AppImage runs on most distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            daemon/package-lock.json
      - name: Add Rust targets
        run: |
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add ${{ matrix.target }}
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          # GStreamer plays the sounds; the AppImage bundles these plugins (bundleMediaFramework).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio gstreamer1.0-alsa
      - run: npm ci
      - name: Sign in to Azure for signing
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Set up signing
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: ./apps/desktop/scripts/windows-signing.ps1 -Setup
      - name: Download the release bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: ${{ runner.temp }}/release-bundles
      - name: Bundle the daemon
        working-directory: .
        run: |
          mkdir -p build/characters
          unzip -o -j "$RUNNER_TEMP"/release-bundles/*-characters.zip '*.acpk' -d build/characters
          node desktop/apps/desktop/scripts/bundle-daemon.mjs --target ${{ matrix.target }} \
            --release-firmware "$RUNNER_TEMP"/release-bundles/*-firmware.zip
      - name: Sign the daemon runtime
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: ./apps/desktop/scripts/windows-signing.ps1 -SignFolder apps/desktop/src-tauri/daemon-runtime
      - name: Build the app
        working-directory: desktop/apps/desktop
        run: |
          signing=()
          if [ "${{ runner.os }}" = Windows ] && [ "$SIGN_WINDOWS" = true ]; then
            # Tauri runs this for the app, its uninstaller and the installer.
            script="$(cygpath -w "$PWD/scripts/windows-signing.ps1" | sed 's/\\/\\\\/g')"
            signing=(--config "{\"bundle\":{\"windows\":{\"signCommand\":{\"cmd\":\"pwsh\",\"args\":[\"-NoProfile\",\"-File\",\"$script\",\"%1\"]}}}}")
          fi
          npm run bundle -- --target ${{ matrix.target }} --config src-tauri/tauri.daemon.conf.json \
            --config "{\"version\":\"$(cat ../../../VERSION)\"}" "${signing[@]}"
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && env.SIGN_WINDOWS == 'true'
        shell: pwsh
        run: |
          # The files that the installer writes: Tauri signs its own copies of the app, not target/.
          $installer = (Get-Item 'apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe').FullName
          $contents = Join-Path $env:RUNNER_TEMP 'installer-contents'
          7z x -y "-o$contents" $installer | Out-Null
          if ($LASTEXITCODE) { throw "7-Zip couldn't open $installer." }
          $programs = @(Get-ChildItem $contents -Recurse -File -Include *.exe, *.dll, *.node |
            Where-Object { $_.Name -ne 'node.exe' -and $_.FullName -notmatch '\\\$PLUGINSDIR\\' })
          if (-not ($programs | Where-Object Name -eq 'agent-companion-desktop.exe')) { throw 'The installer has no agent-companion-desktop.exe.' }
          ./apps/desktop/scripts/windows-signing.ps1 -Verify (@($installer) + $programs.FullName)
      - name: Package
        run: |
          version="$(cat ../VERSION)"
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          name="dist-release/agent-companion-desktop-$version"
          mkdir -p dist-release
          case "${{ runner.os }}" in
            macOS)   cp "$bundle"/dmg/*.dmg "$name-macos-universal.dmg" ;;
            Windows) cp "$bundle"/nsis/*-setup.exe "$name-windows-${{ matrix.arch }}-setup.exe" ;;
            Linux)   cp "$bundle"/appimage/*.AppImage "$name-linux-x86_64.AppImage"
                     cp "$bundle"/deb/*.deb "$name-linux-amd64.deb" ;;
          esac
          ls -l dist-release
      # The app was named Agent Companion before Agent Buddy, and the name sets the Windows install
      # folder and the Debian package. An update from the last release must leave one app, with its data.
      - name: Check an update from the last release on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $previous = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName'
          $download = Join-Path $env:RUNNER_TEMP 'previous'
          gh release download $previous --repo $env:GITHUB_REPOSITORY -p '*-windows-${{ matrix.arch }}-setup.exe' -D $download
          if ($LASTEXITCODE) { throw "Couldn't download the $previous installer." }
          $install = { param($setup) $p = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
                       if ($p.ExitCode) { throw "$setup exited with $($p.ExitCode)." } }
          & $install (Get-Item "$download\*-setup.exe").FullName
          $data = Join-Path $env:LOCALAPPDATA 'ESP32 Agent Companion'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'update-marker') 'kept'
          & $install (Get-Item 'dist-release\*-windows-${{ matrix.arch }}-setup.exe').FullName
          $uninstall = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall'
          $failures = @()
          if (-not (Test-Path "$env:LOCALAPPDATA\Agent Buddy\agent-companion-desktop.exe")) { $failures += 'Agent Buddy is not installed.' }
          if (-not (Test-Path "$uninstall\Agent Buddy")) { $failures += 'Agent Buddy has no uninstall entry.' }
          if (Test-Path "$env:LOCALAPPDATA\Agent Companion") { $failures += "The Agent Companion folder stayed: $(Get-ChildItem -Recurse -Name "$env:LOCALAPPDATA\Agent Companion")" }
          if (Test-Path "$uninstall\Agent Companion") { $failures += 'The Agent Companion uninstall entry stayed.' }
          $shortcuts = @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs", [Environment]::GetFolderPath('Desktop')) |
            Where-Object { Test-Path $_ } | ForEach-Object { Get-ChildItem $_ -Recurse -Filter 'Agent Companion.lnk' }
          if ($shortcuts) { $failures += "Old shortcuts stayed: $($shortcuts.FullName -join ', ')" }
          if ((Get-Content (Join-Path $data 'update-marker')) -ne 'kept') { $failures += 'The app data was not kept.' }
          if ($failures) { $failures | ForEach-Object { Write-Error $_ -ErrorAction Continue }; exit 1 }
          Write-Output "An update from $previous leaves one app, Agent Buddy, and keeps the app data."
      - name: Check an update from the last release on Linux
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName')"
          gh release download "$previous" --repo "$GITHUB_REPOSITORY" -p '*-linux-amd64.deb' -D "$RUNNER_TEMP/previous"
          sudo apt-get install -y "$RUNNER_TEMP"/previous/*.deb
          sudo apt-get install -y ./dist-release/*-linux-amd64.deb
          dpkg-query -W -f='${Status}\n' agent-buddy | grep -qx 'install ok installed'
          if dpkg-query -W -f='${Status}\n' agent-companion 2>/dev/null | grep -q ' installed$'; then
            echo "::error::The agent-companion package stayed."; exit 1
          fi
          test -x /usr/bin/agent-companion-desktop
          grep -lx 'Name=Agent Buddy' /usr/share/applications/*.desktop
          if grep -lx 'Name=Agent Companion' /usr/share/applications/*.desktop; then
            echo "::error::The Agent Companion menu entry stayed."; exit 1
          fi
          echo "An update from $previous leaves one app, Agent Buddy."
      - name: Upload the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          path: desktop/dist-release/*
          if-no-files-found: error

  release:
    needs: [build, daemon-windows, desktop]
    # A tag pushed by hand, or a run on a tag that the Release workflow starts (its tag push starts no workflow).
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      # Starts the website deploy after the release is published.
      actions: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          # Keep the same as requirements-release.txt, which tools/release.py uses for CHANGELOG.md.
          version: v2.14.2
          config: cliff.toml
          args: --latest --strip header
      - name: Download validated bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: artifacts
      - name: Download the desktop app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Add the desktop apps to SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum --check --strict SHA256SUMS
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -printf '%P\n' | LC_ALL=C sort \
            | xargs -d '\n' sha256sum -- > SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            ## Install

            ### The device

            Download the desktop app for your OS (below) and open it. A new installation starts the companion service and opens setup.
            Choose your agents and approve any required hook changes. Choose a character and display option. For a new device, connect USB, detect the device, and confirm the supported Waveshare board before installing firmware and your character. Select **Finish** to open Settings.
            To replace firmware later, use **USB release install or recovery** on the **Device** tab.

            Without the desktop app, download the firmware ZIP for your board below and follow the [installation guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#quick-start).
            **firmware.zip** is for the Waveshare ESP32-S3-Touch-AMOLED-1.75. A ZIP named for another board, such as **waveshare-lcd-154-firmware.zip**, is for that board. Never flash one board's firmware to a different board.
            Each ZIP includes the matching application, boot files, the default Copilot character, and a checksum-validating Python installer.
            Then run `npm run setup` from a clone of the repository.

            The **characters.zip** asset holds every built-in character pack. Install one from a source checkout with `npm run character path/to/openclaw.acpk`.

            ### The desktop app

            The same character, with the same animation, in a small window on your desktop. It carries the
            companion service: when no service runs, it installs the service and asks you to choose and approve agent hooks, so you need
            no clone of the repository and no Node.js. If a service from a clone runs, the app follows that one.

            > [!TIP]
            > A coding agent can install it for you. Paste [this prompt](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#install-with-a-coding-agent)
            > into any coding agent that can run commands on your computer.
            > The Windows app is code-signed. The macOS and Linux apps aren't, so you may still need the step for your OS below.

            #### 🍎 macOS (Apple Silicon and Intel)

            | File | Description |
            | --- | --- |
            | `agent-companion-desktop-*-macos-universal.dmg` | macOS app |

            Open the `.dmg` and drag **Agent Buddy** to **Applications**. The app isn't code-signed, so macOS
            refuses to open it (it may say the app "is damaged"). Clear the download flag once, in Terminal:

            ```bash
            sudo xattr -rd com.apple.quarantine "/Applications/Agent Buddy.app"
            ```

            Then open it from Applications. The running app appears in the Dock and the menu bar. Select its Dock entry to return to an open Settings window.

            #### 🪟 Windows (x64 and Arm64)

            | File | Description |
            | --- | --- |
            | `agent-companion-desktop-*-windows-x64-setup.exe` | Windows installer for Intel and AMD PCs |
            | `agent-companion-desktop-*-windows-arm64-setup.exe` | Windows installer for Arm PCs (Snapdragon) |

            The installer and the app are signed by Dan Wahlin (Azure Artifact Signing), so Smart App Control lets them run.
            While the publisher builds reputation, Windows may still warn:
            1. If your browser warns about the download, choose **Keep**.
            2. When you see **Windows protected your PC**, choose **More info**.
            3. Then choose **Run anyway**.

            The app installs the companion service for your Windows account and starts it when you sign in.
            Agents that run in WSL 2 can use it too: install their hooks from **Settings**.

            #### 🐧 Linux (x86_64)

            | File | Description |
            | --- | --- |
            | `agent-companion-desktop-*-linux-x86_64.AppImage` | Runs on most distributions, including Arch and Omarchy |
            | `agent-companion-desktop-*-linux-amd64.deb` | Debian and Ubuntu package |

            **AppImage:** make it executable, then run it:

            ```bash
            chmod +x agent-companion-desktop-*-linux-x86_64.AppImage
            ./agent-companion-desktop-*-linux-x86_64.AppImage
            ```

            If it says it needs FUSE, install it (`sudo pacman -S --needed fuse2` on Arch and Omarchy,
            `sudo apt install libfuse2` on Ubuntu), or run it with `--appimage-extract-and-run`.

            **Debian or Ubuntu:** `sudo apt install ./agent-companion-desktop-*-linux-amd64.deb`, then run **Agent Buddy** from your apps.

            On Hyprland (including Omarchy) the app floats, pins and un-borders its own window, so there is nothing to configure.
            On other Wayland desktops it runs through XWayland, so it can see the pointer and remember where you put it.

            ## Changes

            ${{ steps.changelog.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy the website with the new character packs
        # The live demo downloads the character packs from the latest release. A release that this
        # job's token publishes starts no workflow by itself, so this starts the website deploy.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
