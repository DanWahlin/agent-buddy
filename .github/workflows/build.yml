name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # arduino/setup-arduino-cli's latest release (v2.0.0) still declares node20; run it on Node 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ARDUINO_CORE: esp32:esp32@3.3.10
  WAVESHARE_REVISION: e4344e70c2fa78a13e8a06566507f1ba8af6672a

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/release.py --check-tag "$GITHUB_REF_NAME"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-art.txt
            requirements-flash.txt
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: daemon/package-lock.json
      - name: Restore lossless compression cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/sprite-compression
          key: sprites-${{ runner.os }}-${{ hashFiles('requirements-art.txt', 'tools/sprite_*.py', 'characters/copilot/tools/export_sprite_firmware.py', 'characters/copilot/sprites/animation.json', 'characters/copilot/expressions/animation.json', 'characters/claude/tools/export_frames.py', 'characters/claude/sprites/animation.json') }}
          restore-keys: sprites-${{ runner.os }}-
      - name: Install build dependencies
        run: |
          python -m pip install -r requirements-art.txt -r requirements-flash.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev
      - name: Reproduce and verify generated assets
        run: |
          python characters/copilot/tools/export_sprite_firmware.py
          python characters/claude/tools/export_frames.py
          python tools/embed_audio.py
          git diff --exit-code -- characters/copilot/frames.bin characters/copilot/frames.json
          git diff --exit-code -- characters/claude/frames.bin characters/claude/frames.json
          git diff --exit-code -- firmware/AgentCompanion/generated/audio_assets.h firmware/AgentCompanion/src/audio_data.cpp
      - name: Test native renderer and release tools
        run: |
          bash tools/test.sh
          bash tools/test_sprite_renderer.sh
          bash tools/test_character_packs.sh
          bash tools/test_character.sh
          bash tools/test_working_bits.sh
          bash tools/test_device_inputs.sh
          bash tools/run_sprite_motion_tests.sh
          bash tools/build_character_preview.sh
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Test companion daemon
        working-directory: daemon
        run: |
          npm ci
          npm test
      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: '1.5.1'
      - name: Install pinned ESP32 core and vendor libraries
        run: |
          mkdir -p "$RUNNER_TEMP/arduino" .deps
          arduino-cli config init --dest-dir "$RUNNER_TEMP/arduino"
          config="$RUNNER_TEMP/arduino/arduino-cli.yaml"
          arduino-cli --config-file "$config" config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli --config-file "$config" core update-index
          arduino-cli --config-file "$config" core install "$ARDUINO_CORE"
          git clone --filter=blob:none --no-checkout https://github.com/waveshareteam/ESP32-S3-Touch-AMOLED-1.75.git .deps/waveshare
          git -C .deps/waveshare sparse-checkout set examples/arduino/libraries/GFX_Library_for_Arduino examples/arduino/libraries/SensorLib
          git -C .deps/waveshare checkout --detach "$WAVESHARE_REVISION"
      - name: Build matched firmware
        run: |
          ARDUINO_CLI="$(command -v arduino-cli)" \
          ARDUINO_CONFIG="$RUNNER_TEMP/arduino/arduino-cli.yaml" \
          WAVESHARE_DIR="$GITHUB_WORKSPACE/.deps/waveshare" \
          bash tools/arduino.sh build
      - name: Package firmware and character packs
        run: |
          python tools/package_release.py --version "$(cat VERSION)" \
            --name "${GITHUB_REPOSITORY#*/}" --repository "$GITHUB_REPOSITORY"
      - name: Upload release bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundles
          path: |
            build/release/*-firmware.zip
            build/release/*-characters.zip
            build/release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  desktop:
    # The desktop app, ready to run: no Rust or Emscripten needed to use it.
    # Built on tags (and by hand), as the release is the only place it ships.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # On macOS and Linux the app carries the daemon, with the release's own character packs.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # The oldest supported Ubuntu, so the AppImage runs on most distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            daemon/package-lock.json
      - name: Add Rust targets
        run: |
          if [ "${{ matrix.target }}" = universal-apple-darwin ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          else
            rustup target add ${{ matrix.target }}
          fi
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Download the character packs
        if: runner.os != 'Windows'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: ${{ runner.temp }}/release-bundles
      - name: Bundle the daemon
        if: runner.os != 'Windows'
        working-directory: .
        run: |
          mkdir -p build/characters
          unzip -o -j "$RUNNER_TEMP"/release-bundles/*-characters.zip '*.acpk' -d build/characters
          node desktop/apps/desktop/scripts/bundle-daemon.mjs --target ${{ matrix.target }}
      - name: Build the app
        working-directory: desktop/apps/desktop
        run: |
          # Windows has no daemon to carry: it runs in WSL 2.
          daemon=()
          [ "${{ runner.os }}" = Windows ] || daemon=(--config src-tauri/tauri.daemon.conf.json)
          npm run bundle -- --target ${{ matrix.target }} "${daemon[@]}" \
            --config "{\"version\":\"$(cat ../../../VERSION)\"}"
      - name: Package
        run: |
          version="$(cat ../VERSION)"
          bundle="apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          name="dist-release/agent-companion-desktop-$version"
          mkdir -p dist-release
          case "${{ runner.os }}" in
            macOS)   cp "$bundle"/dmg/*.dmg "$name-macos-universal.dmg" ;;
            Windows) cp "$bundle"/nsis/*-setup.exe "$name-windows-x64-setup.exe" ;;
            Linux)   cp "$bundle"/appimage/*.AppImage "$name-linux-x86_64.AppImage"
                     cp "$bundle"/deb/*.deb "$name-linux-amd64.deb" ;;
          esac
          ls -l dist-release
      - name: Upload the app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ runner.os }}
          path: desktop/dist-release/*
          if-no-files-found: error

  release:
    needs: [build, desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          version: v2.14.1
          config: cliff.toml
          args: --latest --strip header
      - name: Download validated bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundles
          path: artifacts
      - name: Download the desktop app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          body: |
            ## Install

            ### The device

            On macOS and Linux, download the desktop app (below) and open it. It installs the companion service and opens Settings.
            Connect the device over USB, and click **Install** on the **Device** tab: the app downloads this release's firmware, checks it, and writes it to the device.

            Without the desktop app, download **firmware.zip** below and follow the [installation guide](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#quick-start).
            It includes the matching application, boot files, the default Copilot character, and a checksum-validating Python installer.
            Then run `npm run setup` from a clone of the repository.

            The **characters.zip** asset holds every built-in character pack. Install one from a source checkout with `npm run character path/to/openclaw.acpk`.

            ### The desktop app

            The same character, with the same animation, in a small window on your desktop. On macOS and Linux it
            carries the companion service: when no service runs, it installs it with your agents' hooks, so you need
            no clone of the repository and no Node.js. If a service from a clone runs, the app follows that one.

            > [!TIP]
            > With [GitHub Copilot CLI](https://github.com/features/copilot/cli/), one prompt installs it:
            > `copilot -p "Install the latest Agent Companion desktop app for my OS from https://github.com/${{ github.repository }}/releases"`
            > The app isn't code-signed, so you may still need the step for your OS below.

            #### 🍎 macOS (Apple Silicon and Intel)

            | File | Description |
            | --- | --- |
            | `agent-companion-desktop-*-macos-universal.dmg` | macOS app |

            Open the `.dmg` and drag **Agent Companion** to **Applications**. The app isn't code-signed, so macOS
            refuses to open it (it may say the app "is damaged"). Clear the download flag once, in Terminal:

            ```bash
            sudo xattr -rd com.apple.quarantine "/Applications/Agent Companion.app"
            ```

            Then open it from Applications. It has no Dock icon: look for it in the menu bar.

            #### 🪟 Windows (x64)

            | File | Description |
            | --- | --- |
            | `agent-companion-desktop-*-windows-x64-setup.exe` | Windows installer |

            The app isn't code-signed, so Windows may flag it:
            1. If your browser warns about the download, choose **Keep**.
            2. When you see **Windows protected your PC**, choose **More info**.
            3. Then choose **Run anyway**.

            The companion service doesn't run on Windows itself (use [WSL 2](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md#windows-wsl-2)),
            so on Windows the desktop app shows the character but can't follow your agents yet.

            #### 🐧 Linux (x86_64)

            | File | Description |
            | --- | --- |
            | `agent-companion-desktop-*-linux-x86_64.AppImage` | Runs on most distributions, including Arch and Omarchy |
            | `agent-companion-desktop-*-linux-amd64.deb` | Debian and Ubuntu package |

            **AppImage:** make it executable, then run it:

            ```bash
            chmod +x agent-companion-desktop-*-linux-x86_64.AppImage
            ./agent-companion-desktop-*-linux-x86_64.AppImage
            ```

            If it says it needs FUSE, install it (`sudo pacman -S --needed fuse2` on Arch and Omarchy,
            `sudo apt install libfuse2` on Ubuntu), or run it with `--appimage-extract-and-run`.

            **Debian or Ubuntu:** `sudo apt install ./agent-companion-desktop-*-linux-amd64.deb`, then run **Agent Companion** from your apps.

            On Hyprland (including Omarchy) the app floats, pins and un-borders its own window, so there is nothing to configure.
            On other Wayland desktops it runs through XWayland, so it can see the pointer and remember where you put it.

            ## Changes

            ${{ steps.changelog.outputs.content }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
